<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Prompt Assistant</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <p class="eyebrow">GROQ POWERED</p>
          <h1>Prompt Assistant</h1>
        </div>
      </header>

      <p class="intro">A little help turning ideas into answers.</p>

      <form id="generate-form">
        <label for="prompt">Your prompt</label>
        <textarea id="prompt" name="prompt" maxlength="10000" placeholder="Ask a question or describe what you need…" required></textarea>
        <div class="field-meta"><span>Be specific for better results</span><span id="char-count">0 / 10,000</span></div>
        <button id="generate-button" type="submit" data-mode="response">
          <span class="button-label">Generate response</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
        </button>
        <button id="quiz-button" class="quiz-button" type="submit" data-mode="quiz">
          Generate MCQ quiz (5+ questions)
        </button>
      </form>

      <div id="loading" class="loading" role="status" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span><span id="loading-label">Thinking through it…</span>
      </div>
      <section id="error" class="error" role="alert" hidden></section>
      <section id="output-section" class="output-section" aria-live="polite" hidden>
        <div class="output-heading"><h2 id="output-title">Response</h2><span class="sparkle" aria-hidden="true">✦</span></div>
        <div id="output" class="output"></div>
      </section>
      <section class="history-section" aria-labelledby="history-title">
        <div class="history-heading">
          <h2 id="history-title">History</h2>
          <button id="clear-history" class="clear-history" type="button">Clear</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>
      <footer>Responses can make mistakes. Check important details.</footer>
    </main>
  </body>
</html>
